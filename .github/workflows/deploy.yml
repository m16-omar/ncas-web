# Builds the site and uploads dist/ to Hostinger (nigeriancinemaawards.com) on every push to main.
# Needs one repository secret: FTP_PASSWORD (Settings → Secrets and variables → Actions).
name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Upload to Hostinger
        env:
          FTP_HOST: ftp.nigeriancinemaawards.com
          # This FTP account's root is already .../nigeriancinemaawards.com/public_html
          FTP_USER: u313209061.u313209061
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get install -y -qq lftp > /dev/null
          lftp -c "
            set ftp:ssl-allow yes;
            set ssl:verify-certificate no;
            set ftp:passive-mode on;
            set net:timeout 30;
            set net:max-retries 5;
            set net:reconnect-interval-base 5;
            open -u \"$FTP_USER\",\"$FTP_PASSWORD\" $FTP_HOST;
            rm -f default.php;
            mirror --reverse --verbose --parallel=2 dist/ ./;
          "
